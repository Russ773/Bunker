name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test
        run: dotnet test tests/Bunker.Tests -c Release

      - name: Publish
        run: dotnet publish src/Bunker.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -p:BuildNumber=${{ github.run_number }} -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ env.VERSION }} /DSourceDir=..\publish installer\Bunker.iss'

      # Microsoft Store package. Switched on by the repository variables MSIX_IDENTITY_NAME,
      # MSIX_PUBLISHER and MSIX_PUBLISHER_DISPLAY_NAME (from Partner Center, Product identity).
      # Download it from the run's artifacts and upload it to Partner Center; the Store signs it.
      - name: Build Microsoft Store package
        if: vars.MSIX_IDENTITY_NAME != ''
        run: .\msix\build-msix.ps1 -PublishDir publish -Version $env:VERSION -IdentityName $env:MSIX_IDENTITY_NAME -Publisher $env:MSIX_PUBLISHER -PublisherDisplayName $env:MSIX_PUBLISHER_DISPLAY_NAME -Output "dist\Bunker-$env:VERSION.msix"
        env:
          MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
          MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
          MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}

      - name: Keep the Store package
        if: vars.MSIX_IDENTITY_NAME != ''
        uses: actions/upload-artifact@v4
        with:
          name: bunker-store-package
          path: dist/Bunker-${{ env.VERSION }}.msix

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Bunker-Setup-$VERSION.exe" --title "Bunker $VERSION" --generate-notes


  upload-webspace:
    needs: build
    uses: ./.github/workflows/upload-webspace.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  # Sends the Store package to Partner Center as a new submission (Microsoft still certifies it before it goes live).
  # Switched on by the repository variable STORE_PRODUCT_ID (the app's Store ID, 9PL3409LVH1R) and these secrets:
  # AZURE_AD_TENANT_ID, AZURE_AD_APPLICATION_CLIENT_ID, AZURE_AD_APPLICATION_SECRET and SELLER_ID.
  # If it fails, the release and the webspace upload are unaffected: fix it and use "Re-run failed jobs".
  submit-store:
    needs: build
    if: vars.STORE_PRODUCT_ID != '' && vars.MSIX_IDENTITY_NAME != ''
    runs-on: windows-latest
    steps:
      - name: Get the Store package
        uses: actions/download-artifact@v4
        with:
          name: bunker-store-package
          path: store

      - name: Set up the Microsoft Store CLI
        uses: microsoft/microsoft-store-apppublisher@v1.4

      - name: Sign in to Partner Center
        run: msstore reconfigure --tenantId $env:TENANT_ID --sellerId $env:SELLER_ID --clientId $env:CLIENT_ID --clientSecret $env:CLIENT_SECRET
        env:
          TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          SELLER_ID: ${{ secrets.SELLER_ID }}
          CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}

      - name: Submit to the Store
        run: msstore publish "$((Get-ChildItem store -Filter *.msix).FullName)" -id $env:PRODUCT_ID
        env:
          PRODUCT_ID: ${{ vars.STORE_PRODUCT_ID }}
