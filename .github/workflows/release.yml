name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish
        run: dotnet publish src/Bunker.csproj -c Release -r win-x64 --self-contained -p:PublishSingleFile=true -p:Version=${{ env.VERSION }} -o publish

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DAppVersion=${{ env.VERSION }} /DSourceDir=..\publish installer\Bunker.iss'

      - name: Write latest.json
        shell: bash
        run: |
          printf '{\n  "version": "%s",\n  "file": "Bunker-Setup-%s.exe",\n  "released": "%s"\n}\n' \
            "$VERSION" "$VERSION" "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > dist/latest.json
          cp "dist/Bunker-Setup-$VERSION.exe" dist/Bunker-Setup-latest.exe

      - name: GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "dist/Bunker-Setup-$VERSION.exe" --title "Bunker $VERSION" --generate-notes

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*

  upload-webspace:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Upload to webspace via SFTP
        env:
          SFTP_HOST: ${{ secrets.SFTP_HOST }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USER: ${{ secrets.SFTP_USER }}
          SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
          SFTP_KEY: ${{ secrets.SFTP_KEY }}
          SFTP_PATH: ${{ secrets.SFTP_PATH }}
        run: |
          set -e
          if [ -z "$SFTP_HOST" ]; then echo "SFTP_HOST secret not set - skipping webspace upload"; exit 0; fi
          mkdir -p ~/.ssh
          ssh-keyscan -p "${SFTP_PORT:-22}" "$SFTP_HOST" >> ~/.ssh/known_hosts
          printf 'cd %s\nput dist/Bunker-Setup-*.exe\nput dist/latest.json\n' "${SFTP_PATH:-.}" > batch.txt
          OPTS="-P ${SFTP_PORT:-22} -b batch.txt"
          if [ -n "$SFTP_KEY" ]; then
            echo "$SFTP_KEY" > key && chmod 600 key
            sftp $OPTS -i key "$SFTP_USER@$SFTP_HOST"
          else
            sudo apt-get install -y sshpass >/dev/null
            SSHPASS="$SFTP_PASSWORD" sshpass -e sftp $OPTS "$SFTP_USER@$SFTP_HOST"
          fi
