<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Chaos Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#14161a; --panel:#1d2026; --border:#2c313a; --text:#d6d9de; --muted:#8a919c; --accent:#e0592a; --ok:#4cc38a; --err:#ef5350; --warn:#f0b429; }
  * { box-sizing: border-box; }
  body { margin:0; height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text); font:14px system-ui, sans-serif; }
  header { display:flex; align-items:center; gap:10px; padding:10px 16px; background:var(--panel); border-bottom:1px solid var(--border); flex-wrap:wrap; }
  h1 { font-size:16px; margin:0 12px 0 0; color:var(--accent); }
  h1 small { color:var(--muted); font-weight:normal; }
  input, button { background:var(--bg); color:var(--text); border:1px solid var(--border); border-radius:4px; padding:6px 10px; font:inherit; }
  button { cursor:pointer; background:var(--accent); border-color:var(--accent); color:#fff; }
  button.secondary { background:transparent; border-color:var(--border); color:var(--text); }
  #host { width:160px; } #port { width:80px; } #password { width:140px; }
  #status { margin-left:auto; color:var(--muted); }
  #status.connected { color:var(--ok); } #status.error { color:var(--err); } #status.connecting { color:var(--warn); }
  #console { flex:1; overflow-y:auto; padding:10px 16px; font:13px Consolas, monospace; white-space:pre-wrap; word-break:break-word; }
  .line { padding:1px 0; } .line .t { color:var(--muted); margin-right:8px; }
  .line.chat { color:#7cc4ff; } .line.warning { color:var(--warn); } .line.error { color:var(--err); } .line.system { color:var(--muted); font-style:italic; }
  form { display:flex; gap:8px; padding:10px 16px; background:var(--panel); border-top:1px solid var(--border); }
  #cmd { flex:1; font-family:Consolas, monospace; }
  .tools { display:flex; gap:12px; align-items:center; color:var(--muted); }
</style>
</head>
<body>
<header>
  <h1>Chaos Admin <small>v0.0.1</small></h1>
  <input id="host" placeholder="Server IP" value="127.0.0.1">
  <input id="port" placeholder="RCON port" value="28016">
  <input id="password" type="password" placeholder="RCON password">
  <button id="connect">Connect</button>
  <button id="disconnect" class="secondary">Disconnect</button>
  <span class="tools"><label><input type="checkbox" id="scroll" checked> Auto-scroll</label><button id="clear" class="secondary">Clear</button></span>
  <span id="status">Disconnected</span>
</header>
<div id="console"></div>
<form id="cmdform">
  <input id="cmd" autocomplete="off" placeholder="Enter command (e.g. status, say hello) - Up/Down for history">
  <button>Send</button>
</form>
<script src="app.js"></script>
</body>
</html>
